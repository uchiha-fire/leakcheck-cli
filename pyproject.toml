[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcheck-cli"
version = "0.1.0"
authors = [
  { name = "Zephyrus Labs", email = "zephyrus.labs@gmail.com" },
]
maintainers = [
  { name = "Shubham Sharma", email = "sharmashubham25962@gmail.com" },
]
description = "High-Speed Local Secret Scanner & Git Pre-Commit Guard with entropy analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["security", "secrets", "scanner", "git-hook", "credentials", "cli", "zephyrus-labs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
leakcheck = "leakcheck.cli:main"

[project.urls]
"Homepage" = "https://zephyrus-labs.tech/"
"Repository" = "https://github.com/uchiha-fire/leakcheck-cli"
"Bug Tracker" = "https://github.com/uchiha-fire/leakcheck-cli/issues"
"Documentation" = "https://github.com/uchiha-fire/leakcheck-cli#readme"
"LinkedIn" = "https://www.linkedin.com/in/shubham-sharma-28487819b/"

[tool.setuptools.packages.find]
where = ["."]
include = ["leakcheck*"]
